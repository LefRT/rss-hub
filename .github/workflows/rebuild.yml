name: rebuild
on:
  schedule:
    # 每 12 小时一次（UTC 00:00 / 12:00 = 北京 08:00 / 20:00）
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate feeds
        run: python3 generate.py
      - name: Commit feeds
        run: |
          git config user.name "rss-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rss/
          if git diff --cached --quiet; then
            echo "NO CHANGES"
          else
            git commit -m "rebuild feeds ($(date -u +%F\ %T UTC)) [skip ci]"
            git push
          fi
